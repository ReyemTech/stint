name: Deploy docs

# Builds the Starlight site and syncs it to the docs-pages branch.
# Pages auto-deploys on push to docs-pages (deploy-pages.yml).

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/deploy-docs.yml"
      - "scripts/release/publish-docs.sh"
  workflow_dispatch:

permissions:
  contents: write

# Don't conflict with release.yml's per-ref group; docs deploys are
# independent. Cancel any in-flight rebuild if a newer one starts.
concurrency:
  group: docs-pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: 9 }

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies (site filter)
        run: pnpm install --frozen-lockfile --filter stint-docs...

      - name: Build Starlight site
        run: pnpm --filter stint-docs build

      - name: Publish to docs-pages branch
        env:
          # Push with the RELEASE_TOKEN PAT rather than GITHUB_TOKEN so that
          # the push to docs-pages triggers downstream workflows
          # (deploy-pages.yml). GitHub Actions deliberately suppresses
          # workflow triggers for commits authored by GITHUB_TOKEN to
          # prevent infinite loops — using a user PAT bypasses that.
          # Falls back to GITHUB_TOKEN if RELEASE_TOKEN isn't configured
          # (forks / first-run scenarios). When that fallback path runs,
          # someone has to manually trigger deploy-pages.yml via
          # `gh workflow run deploy-pages.yml --ref docs-pages` until a PAT
          # is configured.
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: scripts/release/publish-docs.sh
