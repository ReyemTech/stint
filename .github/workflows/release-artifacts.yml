# .github/workflows/release-artifacts.yml
name: Build release artifacts

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      channel:
        required: false
        type: string
        default: stable

jobs:
  build:
    runs-on: macos-14
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: pnpm/action-setup@v4
        with: { version: 9 }

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo build (Swatinem/rust-cache)
        uses: Swatinem/rust-cache@v2
        with:
          # Include the target triples in the cache key so x86_64 + aarch64 caches don't fight.
          key: release-universal
          cache-on-failure: true

      - name: Bump versions to match release input
        env:
          VERSION: ${{ inputs.version }}
        run: scripts/release/bump-versions.sh "$VERSION"

      - name: Verify Tauri updater pubkey is configured
        run: |
          set -euo pipefail
          if grep -q 'REPLACE_ME_WITH_OUTPUT_OF_TAURI_SIGNER_GENERATE' crates/stint-app/tauri.conf.json; then
            echo "error: tauri.conf.json still has placeholder pubkey." >&2
            echo "       Run scripts/release/bootstrap-secrets.sh on a maintainer machine to" >&2
            echo "       generate the Tauri updater key pair and substitute the public key." >&2
            exit 1
          fi
          echo "✓ tauri.conf.json plugins.updater.pubkey is configured"

      - name: Install Tauri CLI (prebuilt binary)
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@2

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/Library/pnpm
          key: release-pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml','ui/pnpm-lock.yaml') }}

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: Verify all required secrets are set
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          for var in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_PRIVATE_KEY KEYCHAIN_PASSWORD TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            if [[ -z "${!var:-}" ]]; then
              missing+=("$var")
            fi
          done
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "error: missing required secrets:" >&2
            printf '  - %s\n' "${missing[@]}" >&2
            echo "Run scripts/release/bootstrap-secrets.sh on a maintainer machine." >&2
            exit 1
          fi
          echo "✓ all required secrets present"

      - name: Set up ephemeral keychain
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"

          echo "$APPLE_CERTIFICATE" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -A \
            -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/cert.p12"

          echo "KEYCHAIN_PATH=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Build CLI for both archs
        run: |
          cargo build --release --target aarch64-apple-darwin -p stint-cli
          cargo build --release --target x86_64-apple-darwin  -p stint-cli
          mkdir -p target/universal-apple-darwin/release
          lipo -create -output target/universal-apple-darwin/release/stint \
            target/aarch64-apple-darwin/release/stint \
            target/x86_64-apple-darwin/release/stint

      # Regenerate the bundled man page AFTER the version bump but BEFORE
      # `cargo tauri build`. The bundle.resources entry in tauri.conf.json
      # references `resources/man1/stint.1`; doing this here guarantees the
      # file on disk is at the bumped version when Tauri's bundle stage reads
      # it. (The old beforeBuildCommand approach was unreliable — Tauri's
      # bundle stage appears to snapshot resources during early config-parse
      # rather than reading fresh from disk on every bundle pass.)
      - name: Regenerate stint(1) man page at bumped version
        run: |
          ./target/universal-apple-darwin/release/stint generate-man \
            crates/stint-app/resources/man1
          head -3 crates/stint-app/resources/man1/stint.1   # version sanity in log

      - name: Build universal Tauri app (.app only — DMG is built later from embedded version)
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          STINT_GOOGLE_CLIENT_ID: ${{ secrets.STINT_GOOGLE_CLIENT_ID }}
          STINT_GOOGLE_CLIENT_SECRET: ${{ secrets.STINT_GOOGLE_CLIENT_SECRET }}
        run: |
          cd crates/stint-app
          cargo tauri build --target universal-apple-darwin --bundles app

      - name: Embed CLI in .app
        run: |
          # Tauri bundles to the workspace target dir, not crates/stint-app/target
          APP="target/universal-apple-darwin/release/bundle/macos/Stint.app"
          test -d "$APP" || { echo "error: $APP not found"; find target -name 'Stint.app' -type d; exit 1; }
          cp target/universal-apple-darwin/release/stint "$APP/Contents/MacOS/stint"
          echo "APP_PATH=$APP" >> "$GITHUB_ENV"

      - name: Relocate StintWidget.appex into Contents/PlugIns/
        run: |
          # build.rs produces crates/stint-app/PlugIns/StintWidget.appex.
          # Tauri's bundle.resources puts files under Contents/Resources/
          # but macOS WidgetKit only discovers widget extensions at
          # Contents/PlugIns/. Move it into place + strip the duplicated
          # Resources/PlugIns copy left behind by Tauri.
          SRC="crates/stint-app/PlugIns/StintWidget.appex"
          DEST="$APP_PATH/Contents/PlugIns/StintWidget.appex"
          if [ ! -d "$SRC" ]; then echo "::error::appex source missing at $SRC"; exit 1; fi
          mkdir -p "$(dirname "$DEST")"
          rm -rf "$DEST"
          cp -R "$SRC" "$DEST"
          rm -rf "$APP_PATH/Contents/Resources/PlugIns"

      - name: Smoke-test embedded version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          actual=$("$APP_PATH/Contents/MacOS/stint" --version | awk '{print $2}')
          if [[ "$actual" != "$VERSION" ]]; then
            echo "error: embedded stint --version=$actual, expected $VERSION" >&2
            exit 1
          fi
          plist_ver=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP_PATH/Contents/Info.plist")
          if [[ "$plist_ver" != "$VERSION" ]]; then
            echo "error: Info.plist version=$plist_ver, expected $VERSION" >&2
            exit 1
          fi
          echo "✓ embedded version matches: $VERSION"

      - name: Sign embedded CLI individually (hardened runtime, own identifier)
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          # The CLI is a Mach-O without a separate bundle. embed_plist in
          # stint-cli's main.rs injects its Info.plist into the binary's
          # __TEXT,__info_plist section so hardened runtime's kernel
          # validation accepts it. We sign with an explicit identifier
          # (tech.reyem.stint.cli) so the binary's signed identity matches
          # its embedded plist.
          codesign --force --options runtime \
            --identifier tech.reyem.stint.cli \
            --sign "$APPLE_SIGNING_IDENTITY" \
            --entitlements crates/stint-app/entitlements.plist \
            "$APP_PATH/Contents/MacOS/stint"

      - name: Verify StintIntents framework + App Intents metadata
        run: |
          FRAMEWORK="$APP_PATH/Contents/Frameworks/StintIntents.framework"
          STENCIL="$FRAMEWORK/Versions/A/Resources/Metadata.appintents/extract.actionsdata"
          INFO="$FRAMEWORK/Versions/A/Resources/Info.plist"
          if [ ! -d "$FRAMEWORK" ]; then echo "::error::framework missing"; exit 1; fi
          if [ ! -f "$STENCIL" ]; then echo "::error::stencil missing"; exit 1; fi
          if ! /usr/libexec/PlistBuddy -c "Print :NSAppIntentsPackage" "$INFO" 2>/dev/null | grep -qi true; then
            echo "::error::NSAppIntentsPackage missing from Info.plist"; exit 1;
          fi
          COUNT=$(python3 -c "import json,sys; print(len(json.load(open(sys.argv[1])).get('actions',{})))" "$STENCIL")
          echo "AppIntent types in stencil: $COUNT"
          if [ "$COUNT" -lt 11 ]; then echo "::error::expected >=11 intents, got $COUNT"; exit 1; fi

      - name: Sign GUI binary + .app bundle (hardened runtime + entitlements)
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          # Sign the GUI binary first (inner), then the bundle wrapper
          # (which seals CodeResources including the CLI's hash). Avoid
          # --deep so the per-binary signatures we did individually
          # aren't overwritten.
          # Sign embedded framework first (inner) so the wrapper seals it.
          codesign --force --options runtime \
            --sign "$APPLE_SIGNING_IDENTITY" \
            "$APP_PATH/Contents/Frameworks/StintIntents.framework"
          # Sign the widget appex so the bundle wrapper can seal it. The
          # appex's binary already carries an ad-hoc signature from build.rs;
          # this overwrites with the production identity. The sandbox
          # entitlement is required — pluginkit refuses to register
          # extensions without com.apple.security.app-sandbox = true.
          codesign --force --options runtime \
            --sign "$APPLE_SIGNING_IDENTITY" \
            --entitlements crates/stint-app/swift/StintWidget/StintWidget.entitlements \
            "$APP_PATH/Contents/PlugIns/StintWidget.appex"
          codesign --force --options runtime \
            --sign "$APPLE_SIGNING_IDENTITY" \
            --entitlements crates/stint-app/entitlements.plist \
            "$APP_PATH/Contents/MacOS/stint-app"
          codesign --force --options runtime \
            --sign "$APPLE_SIGNING_IDENTITY" \
            --entitlements crates/stint-app/entitlements.plist \
            "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign --verify --strict --verbose=2 "$APP_PATH/Contents/MacOS/stint"
          codesign --verify --strict --verbose=2 "$APP_PATH/Contents/Frameworks/StintIntents.framework"
          codesign --verify --strict --verbose=2 "$APP_PATH/Contents/PlugIns/StintWidget.appex"

      - name: Notarize .app
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: scripts/release/notarize.sh "$APP_PATH"

      - name: Build .dmg
        env:
          VERSION: ${{ inputs.version }}
        run: |
          OUT="$RUNNER_TEMP/Stint-${VERSION}.dmg"
          create-dmg \
            --volname "Stint ${VERSION}" \
            --window-size 540 380 \
            --icon-size 96 \
            --icon "Stint.app" 140 180 \
            --app-drop-link 400 180 \
            "$OUT" "$APP_PATH"
          echo "DMG_PATH=$OUT" >> "$GITHUB_ENV"

      - name: Sign + notarize .dmg
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          codesign --force --sign "$APPLE_SIGNING_IDENTITY" "$DMG_PATH"
          scripts/release/notarize.sh "$DMG_PATH"

      - name: Tar CLI for curl installer
        env:
          VERSION: ${{ inputs.version }}
        run: |
          OUT="$RUNNER_TEMP/stint-${VERSION}-universal-apple-darwin.tar.gz"
          tar -czf "$OUT" -C target/universal-apple-darwin/release stint
          echo "TARBALL_PATH=$OUT" >> "$GITHUB_ENV"

      - name: Sign update bundle (Tauri updater)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          BUNDLE="$RUNNER_TEMP/Stint.app.tar.gz"
          tar -czf "$BUNDLE" -C "$(dirname "$APP_PATH")" "$(basename "$APP_PATH")"
          cargo tauri signer sign "$BUNDLE"
          echo "BUNDLE_PATH=$BUNDLE" >> "$GITHUB_ENV"
          echo "BUNDLE_SIG_PATH=${BUNDLE}.sig" >> "$GITHUB_ENV"

      - name: Generate latest.json
        env:
          VERSION: ${{ inputs.version }}
        run: |
          OUT="$RUNNER_TEMP/latest.json"
          URL="https://github.com/reyemtech/stint/releases/download/v${VERSION}/Stint.app.tar.gz"
          scripts/release/generate-latest-json.sh \
            --version "${VERSION}" \
            --signature-path "$BUNDLE_SIG_PATH" \
            --bundle-url "$URL" \
            --output "$OUT"
          echo "LATEST_JSON_PATH=$OUT" >> "$GITHUB_ENV"

      - name: Render install.sh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          OUT="$RUNNER_TEMP/install.sh"
          TARBALL_SHA=$(shasum -a 256 "$TARBALL_PATH" | awk '{print $1}')
          DMG_SHA=$(shasum -a 256 "$DMG_PATH" | awk '{print $1}')
          scripts/release/render-install-script.sh \
            --version "${VERSION}" \
            --tarball-sha256 "$TARBALL_SHA" \
            --dmg-sha256 "$DMG_SHA" \
            --output "$OUT"
          echo "INSTALL_SH_PATH=$OUT" >> "$GITHUB_ENV"

      - name: Stage artifacts
        run: |
          mkdir -p target/release-artifacts
          cp "$DMG_PATH" target/release-artifacts/
          cp "$TARBALL_PATH" target/release-artifacts/
          cp "$BUNDLE_PATH" target/release-artifacts/Stint.app.tar.gz
          cp "$BUNDLE_SIG_PATH" target/release-artifacts/Stint.app.tar.gz.sig
          cp "$LATEST_JSON_PATH" target/release-artifacts/latest.json
          cp "$INSTALL_SH_PATH" target/release-artifacts/install.sh
          cp "${INSTALL_SH_PATH}.sha256" target/release-artifacts/install.sh.sha256

      - name: Generate checksums.txt
        run: |
          cd target/release-artifacts
          # Iterate per-file so output is `<hash>  <bare-filename>` (no `./` prefix).
          # The CLI self-updater (stint update) and install.sh parse `<hash>  <filename>`
          # and look up by bare filename — `./` prefix would break the match.
          : > checksums.txt
          for f in *.dmg *.tar.gz install.sh; do
            shasum -a 256 "$f" >> checksums.txt
          done
          cat checksums.txt

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain "$KEYCHAIN_PATH" || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: target/release-artifacts/*
          if-no-files-found: error
          retention-days: 7
